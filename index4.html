<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3A8C">
<title>すみだまつり 福引き</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#1B2147; --muted:#646B8C; --line:#DADDEA;
  --ai:#2B3A8C; --stage:#2B3A8C; --shu:#D7372A;
  --b-gold:#E3B53B; --b-silver:#B9BFCC; --b-red:#D7372A; --b-blue:#2E5BD8; --b-green:#2E9E5B; --b-white:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#11142A;--surface:#1A1F3F;--ink:#EEF0FA;--muted:#9AA0C2;--line:#2C3363;--ai:#8D9BF0;--stage:#26307A}
}
:root[data-theme="dark"]{--bg:#11142A;--surface:#1A1F3F;--ink:#EEF0FA;--muted:#9AA0C2;--line:#2C3363;--ai:#8D9BF0;--stage:#26307A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:1.3rem;margin:0;color:var(--ai)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:.9rem;padding:6px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ai);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#11142A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#11142A}}
.tab:focus-visible,.draw:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--b-gold);outline-offset:2px}
[hidden]{display:none!important}

/* Stage */
.stage{background:var(--stage);color:#fff;border-radius:20px;padding:22px 18px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.count{font-family:"Dela Gothic One",sans-serif;font-size:clamp(2.8rem,15vw,4.6rem);line-height:1}
.count small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:1rem;font-weight:700;margin-left:4px;opacity:.85}
.count-note{opacity:.75;font-size:.88rem;margin-top:4px}
.stamps{display:flex;align-items:center;gap:6px;margin-top:16px;flex-wrap:wrap;justify-content:center;font-size:.88rem}
.chip{appearance:none;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}
.credit{margin-top:8px;font-weight:700;font-size:.95rem;min-height:1.6em}
.tray{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 0 20px;min-height:290px}
.ball{width:clamp(110px,34vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.75),rgba(255,255,255,0) 38%),var(--ball,#ffffff22);
  box-shadow:inset -10px -14px 24px rgba(0,0,0,.22),0 14px 0 -6px rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.25)}
.ball.empty{background:transparent;border:3px dashed rgba(255,255,255,.35);box-shadow:none}
.ball.white{border-color:#cfd3e2}
.ball.roll{animation:roll .85s cubic-bezier(.25,.9,.3,1.15)}
@keyframes roll{0%{transform:translateY(-180px) rotate(-400deg) scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
.ball.gold{animation:roll .85s cubic-bezier(.25,.9,.3,1.15),glow 1.4s ease-in-out .85s 3}
@keyframes glow{50%{box-shadow:inset -10px -14px 24px rgba(0,0,0,.22),0 0 0 18px rgba(227,181,59,.35),0 0 60px 20px rgba(227,181,59,.5)}}
.tier{font-weight:700;background:rgba(255,255,255,.14);padding:2px 14px;border-radius:999px;min-height:1.6em}
.tier:empty{visibility:hidden}
.prize{font-family:"Dela Gothic One",sans-serif;font-size:clamp(1.4rem,6.5vw,2.2rem);line-height:1.3;max-width:18ch}
.draw{appearance:none;border:0;background:var(--shu);color:#fff;font-family:"Dela Gothic One",sans-serif;font-size:1.5rem;
  width:100%;max-width:340px;padding:16px 20px;border-radius:999px;cursor:pointer;box-shadow:0 6px 0 #9E2318;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.draw:active{transform:translateY(4px);box-shadow:0 2px 0 #9E2318}
.draw:disabled{opacity:.5;cursor:not-allowed}

/* Admin */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h2{font-size:1rem;margin:0 0 10px}
.lock{text-align:center;padding:28px 18px}
.lock p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.lock form{display:flex;gap:8px;max-width:340px;margin:0 auto}
.lock input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.err{color:var(--shu);font-size:.88rem;min-height:1.5em;margin-top:8px}
.summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.summary b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:1.6rem}
.stock{display:grid;grid-template-columns:auto 1fr auto;gap:7px 10px;align-items:center;font-size:.9rem}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.stock .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.stock .n b{color:var(--ink)}
.stock .out{opacity:.4}
.hist{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;font-size:.9rem}
.hist li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .no{font-variant-numeric:tabular-nums;color:var(--muted);min-width:4.4em}
.listbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:.88rem;color:var(--muted)}
.listbar select{font:inherit;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.seq{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.seq table{width:100%;border-collapse:collapse;font-size:.88rem}
.seq th,.seq td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.seq th{position:sticky;top:0;background:var(--surface);font-weight:700;z-index:1}
.seq td.no{font-variant-numeric:tabular-nums;color:var(--muted)}
.seq tr.done td{opacity:.45}
.seq tr.next td{background:color-mix(in srgb,var(--b-gold) 22%,transparent);opacity:1}
.seq .dot{display:inline-block;vertical-align:-2px;margin-right:6px}
.empty-msg{color:var(--muted);font-size:.9rem;margin:0}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.btn.primary{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.danger{color:var(--shu);border-color:var(--shu)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.rules{font-size:.86rem;color:var(--muted);margin:0 0 12px;padding-left:1.1em}
@media (prefers-reduced-motion: reduce){.ball.roll,.ball.gold{animation:none}}
</style>
<style>
header a{color:var(--ai);font-weight:700;font-size:.9rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}
.stage .done{font-weight:700;opacity:.85;min-height:1.6em;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>すみだまつり 福引き</h1>
  </header>
  <section>
    <div class="stage" aria-live="polite">
      <div class="stamps" role="group" aria-label="抽選回数">
        <span>抽選回数</span>
        <button class="chip" data-s="1">1回</button><button class="chip" data-s="2">2回</button>
      </div>
      <div class="credit" id="credit"></div>
      <div class="done" id="done"></div>
      <div class="tray">
        <div class="ball empty" id="ball"></div>
        <div class="tier" id="tier"></div>
        <div class="prize" id="prize"></div>
      </div>
      <button class="draw" id="drawBtn">抽選する</button>
    </div>
  </section>
</div>

<script>
const PRIZES = [
  {name:"自転車", n:1, tier:"gold", label:"特賞"},
  {name:"トイコー サウンドシリーズ", n:3, tier:"silver", label:"1等"},
  {name:"トイコー サウンドトレインシリーズ", n:6, tier:"silver", label:"1等"},
  {name:"トイコー はらたく車", n:6, tier:"silver", label:"1等"},
  {name:"トイコー ミニサウンドシリーズ", n:6, tier:"silver", label:"1等"},
  {name:"新日本フィル コンサートペアチケット", n:8, tier:"silver", label:"1等"},
  {name:"東新アクア 入場券", n:11, tier:"silver", label:"1等"},
  {name:"キャンバストートバック", n:22, tier:"silver", label:"1等"},
  {name:"熟まろ 逸品酢燻製", n:96, tier:"red", label:"2等"},
  {name:"郵政博物館オリジナルふせん", n:120, tier:"red", label:"2等"},
  {name:"ボディスポンジ", n:200, tier:"red", label:"2等"},
  {name:"キュキュット", n:480, tier:"blue", label:"3等"},
  {name:"オリナス食事券（200円分）", n:500, tier:"blue", label:"3等"},
  {name:"ステッカー", n:541, tier:"green", label:"4等"},
  {name:"ポケットティッシュ", n:1000, tier:"white", label:"5等"},
];
const BIKE=0, VOUCHER=12;
const TOTAL=3000, BIKE_BY=500, VOUCHER_BY=1000; // 自転車は500回目まで、商品券は1,000回目までに全部出す
const CREDITS={1:1,2:2}; // ゲーム画面に表示された抽選回数
const KEY="sumimatsu-index4-live-v3"; // 抽選ページと管理ページで共通の保存領域

function rnd(max){const a=new Uint32Array(1),lim=Math.floor(0x100000000/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%max}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rnd(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
// 「抽選する」を押した瞬間に景品を決める（事前の並びは作らない）
function pickPrize(){
  const n=state.idx+1, rem=state.rem;
  // 自転車：500回目までの残り枠に対して1本
  if(n<=BIKE_BY && rem[BIKE]>0 && rnd(BIKE_BY-n+1)<rem[BIKE]) return BIKE;
  // 商品券：1,000回目までの残り枠（自転車用に取っておく枠は除く）に対して残り枚数の割合
  if(n<=VOUCHER_BY && rem[VOUCHER]>0){
    const slots=(VOUCHER_BY-n+1)-rem[BIKE];
    if(rnd(slots)<rem[VOUCHER]) return VOUCHER;
  }
  let total=0; rem.forEach((c,id)=>{if(id!==BIKE&&id!==VOUCHER) total+=c});
  let r=rnd(total);
  for(let id=0;id<rem.length;id++){ if(id===BIKE||id===VOUCHER) continue; if(r<rem[id]) return id; r-=rem[id]; }
}

let state=null, busy=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.hist)&&Array.isArray(s.rem)&&s.rem.length===PRIZES.length&&s.hist.length===s.idx){if(!s.presses)s.presses={1:0,2:0};return s}}catch(e){}return null}
function fresh(){state={hist:[],rem:PRIZES.map(p=>p.n),idx:0,credit:0,presses:{1:0,2:0}};save()}

const $=id=>document.getElementById(id);
const tierColor=t=>`var(--b-${t})`;

function setBall(id,animate){
  const b=$("ball");b.className="ball";
  if(id==null){b.classList.add("empty");b.style.removeProperty("--ball");return}
  const p=PRIZES[id];b.style.setProperty("--ball",tierColor(p.tier));
  if(p.tier==="white") b.classList.add("white");
  if(animate){void b.offsetWidth;b.classList.add(p.tier==="gold"?"gold":"roll")}
}
function showResult(id,animate){
  setBall(id,animate);
  if(id==null){$("tier").textContent="";$("prize").textContent=state.credit>0?"ボタンを押して抽選":"抽選回数を選んでください";return}
  $("tier").textContent=PRIZES[id].label;$("prize").textContent=PRIZES[id].name;
}
function renderDraw(){
  const i=state.idx,c=state.credit||0;
  $("done").textContent=i>=TOTAL?"景品がなくなりました（抽選終了）":"";
  $("credit").textContent=i>=TOTAL?"":c>0?`残りの抽選権 ${c}回`:"";
  $("drawBtn").disabled=i>=TOTAL||c<=0||busy;
}

function draw(){
  if(busy||state.idx>=TOTAL||!(state.credit>0)) return;
  busy=true;
  const id=pickPrize();state.hist.push(id);state.rem[id]--;state.idx++;state.credit--;save();
  renderDraw();showResult(id,true);
  const wait=matchMedia("(prefers-reduced-motion: reduce)").matches?150:(PRIZES[id].tier==="gold"?1800:850);
  setTimeout(()=>{busy=false;renderDraw()},wait);
}
$("drawBtn").addEventListener("click",draw);
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
  if(busy||state.idx>=TOTAL) return;
  if((state.credit||0)>0&&!confirm(`まだ抽選権が${state.credit}回残っています。次の人に切り替えますか？`)) return;
  state.credit=Math.min(CREDITS[b.dataset.s],TOTAL-state.idx);
  state.presses[b.dataset.s]=(state.presses[b.dataset.s]||0)+1;save(); // 押された回数を記録
  showResult(null,false);renderDraw();
}));
// 管理ページで取り消し・リセットされたら反映
window.addEventListener("storage",e=>{if(e.key!==KEY||busy) return;state=load()||(fresh(),state);renderDraw();showResult(null,false)});

state=load();if(!state) fresh();
renderDraw();showResult(null,false);
</script>
</body>
</html>
